### Site settings ###
title               : Ayush Kaushal
baseurl             : ""                     # empty: the site is served from <username>.github.io directly

### Plugins ###
plugins:
  - jemoji

### Exclude from processing ###
exclude:
  - README.md
  - CONTRIBUTING.md
  - LICENSE
  - "*.log"
  - scripts

### Project pages (/projects/<name>/) ###
collections:
  project_pages:
    output: true
    permalink: /projects/:name/
