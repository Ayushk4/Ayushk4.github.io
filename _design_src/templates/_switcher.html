<nav class="pv" aria-label="Design preview switcher">
  <span class="pv-l">Preview</span>
  {% for key, name, _ in designs %}
  <a href="/designs/{{ key }}/{{ subs[page] }}"{% if key == design %} aria-current="page"{% endif %}>{{ name }}</a>
  {% endfor %}
  <a class="pv-all" href="/designs/">All</a>
</nav>
<style>
.pv{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);z-index:50;display:flex;align-items:center;gap:2px;
padding:4px;border-radius:999px;background:#111;color:#eee;font:500 13px/1 system-ui,-apple-system,"Segoe UI",sans-serif;
box-shadow:0 4px 18px rgba(0,0,0,.25);white-space:nowrap}
.pv a{color:#ddd;text-decoration:none;padding:8px 11px;border-radius:999px}
.pv a:hover{background:#2a2a2a;color:#fff}
.pv a[aria-current]{background:#fff;color:#111}
.pv-l{padding:0 8px 0 10px;color:#999;font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.pv-all{color:#999!important}
body{padding-bottom:72px}
@media print{.pv{display:none}}
</style>
