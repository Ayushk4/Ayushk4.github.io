<script>
(function(){
  var root=document.documentElement;
  function cur(){var t=root.getAttribute('data-theme');if(t)return t;return matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'}
  document.querySelectorAll('[data-theme-toggle]').forEach(function(b){
    b.addEventListener('click',function(){var n=cur()==='dark'?'light':'dark';root.setAttribute('data-theme',n);try{localStorage.setItem('ak-theme',n)}catch(e){}});
  });
  document.querySelectorAll('[data-view-btn]').forEach(function(b){
    b.addEventListener('click',function(){
      var v=b.getAttribute('data-view-btn');
      document.querySelectorAll('[data-view]').forEach(function(s){s.hidden=s.getAttribute('data-view')!==v});
      document.querySelectorAll('[data-view-btn]').forEach(function(x){x.setAttribute('aria-pressed',x===b?'true':'false')});
    });
  });
})();
</script>
