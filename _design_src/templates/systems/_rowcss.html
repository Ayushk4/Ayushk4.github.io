<style>
.row{display:grid;grid-template-columns:44px 176px 1fr;gap:12px;padding:12px 0;border-top:1px solid var(--rule2)}
.row:first-child{border-top:0}
.row .tag{white-space:normal;line-height:1.35}
.row .yr{font-size:12px;color:var(--muted);padding-top:2px}
.row .t{font-weight:600;line-height:1.35;margin:0 0 3px}
.row .a{font-size:13.5px;color:var(--ink2);margin:0 0 5px}
.row .abs{font-size:13.5px;color:var(--ink2);margin:8px 0 0;max-width:72ch}
@media (max-width:640px){.row{grid-template-columns:1fr;gap:4px}.row .yr{display:none}}
</style>
<script>
document.addEventListener('click',function(e){var a=e.target.closest('[data-abs]');if(!a)return;e.preventDefault();var p=a.closest('.bd').querySelector('.abs');p.hidden=!p.hidden;});
</script>
