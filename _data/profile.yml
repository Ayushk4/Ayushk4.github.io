bio:
  - "I work on efficient systems that keep learning as they see more context: meta-training them cheaply, training them continually, and measuring how they scale so we can understand them."
  - "I'm a PhD student at Mila and Université de Montréal, advised by Irina Rish. Before this, I co-founded Nolano, where I worked on efficient foundation models: pretraining ternary language models (Spectra, ICLR 2025 Spotlight; Spectra 1.1, ACL 2025) and making them cheap to run. I did my Master's at UT Austin and my Bachelor's at IIT Kharagpur, and spent a summer at Google building efficient encoders for streaming text."

