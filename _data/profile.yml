# Single source for the sidebar, the footer and <meta name="description"> on /dev/.
# Edit here only; the page never repeats this text.

name: Ayush Kaushal

# URL of the new homepage. Change to "/" when it replaces the live homepage.
home: /dev/

# Optional one-line tagline. While null it is hidden, and the meta
# description uses the first bio paragraph.
tagline: null

bio:
  - "I study compute-efficient learning in systems that improve as they condition on more context: meta-training of in-context learners, continual pretraining, and scaling analysis that characterizes their behaviour."
  - "I'm a PhD student at Mila and Université de Montréal, advised by Irina Rish. Previously, I co-founded Nolano, where my work focused on low-bit pretraining and inference for foundation models, including the Spectra suite of ternary language models (ICLR 2025 Spotlight) and its scaling-law follow-up (ACL 2025). I hold an MS from UT Austin and a B.Tech from IIT Kharagpur, and was a research intern at Google, where I worked on encoder architectures for streaming sequence tagging."

