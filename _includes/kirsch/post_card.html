<li class="post">
  {%- if include.image %}
  <img class="post-img" src="{{ include.image | relative_url }}" alt="{{ include.image_alt | escape }}" width="88" height="88">
  {%- endif %}
  <div class="post-body">
    <time class="meta" datetime="{{ include.date | date: '%Y-%m-%d' }}">{{ include.date | date: '%b %-d, %Y' }}</time>
    <h3 class="post-t"><a href="{{ include.url | relative_url }}">{{ include.title | escape }}</a></h3>
    {%- if include.summary %}
    <p class="post-s">{{ include.summary | strip_html | escape }}</p>
    {%- endif %}
    <a class="more" href="{{ include.url | relative_url }}">Continue reading<span class="vh">: {{ include.title | escape }}</span></a>
  </div>
</li>
